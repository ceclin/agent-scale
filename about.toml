# Ordered by preference when a dependency offers multiple license choices.
accepted = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "CC0-1.0",
  "ISC",
  "MPL-2.0",
  "Unlicense",
  "Unicode-3.0",
  "Zlib",
]
ignore-dev-dependencies = true
private = { ignore = true }
workarounds = ["ring", "rustls"]
