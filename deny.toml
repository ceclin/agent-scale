[advisories]
# Reject withdrawn releases. Compatible dependency upgrades moved the iroh
# graph off the previously yanked spin 0.9.8 and 0.10.0 releases.
ignore = [
  # Transitive through iroh/netlink; no maintained compatible replacement.
  "RUSTSEC-2024-0436",
  # Transitive through iroh-blobs/bao-tree; no maintained compatible replacement.
  "RUSTSEC-2024-0370",
  # AVR-only heapless dependency; AVR is outside the supported target matrix.
  "RUSTSEC-2023-0089",
]
yanked = "deny"

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unlicense",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-git = "deny"
unknown-registry = "deny"
