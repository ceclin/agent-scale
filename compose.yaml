name: agent-scale

x-control-image: &control-image
  image: ${AGENT_SCALE_CONTROL_IMAGE:-ghcr.io/ceclin/agent-scale-control:latest}

x-relay-image: &relay-image
  image: ${AGENT_SCALE_RELAY_IMAGE:-ghcr.io/ceclin/agent-scale-relay:latest}

x-environment: &environment
  AS_CONTROL_STATE_DIR: /control

x-container-defaults: &container-defaults
  init: true
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=16m,mode=1777
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
  stop_grace_period: 15s

services:
  bootstrap:
    <<: [*control-image, *container-defaults]
    command:
      - as-control
      - bootstrap
      - --public-url
      - ${CONTROL_PUBLIC_URL:-http://localhost:3350}
      - --audience
      - ${CONTROL_AUDIENCE:-agent-scale-local}
      - --relay-name
      - ${RELAY_NAME:-primary}
      - --relay-url
      - ${RELAY_PUBLIC_URL:-http://localhost:3340}
      - --relay-ttl-secs
      - ${RELAY_INVITE_TTL_SECS:-900}
      - --relay-invite-out
      - /bootstrap/relay.join
    environment: *environment
    volumes:
      - control-state:/control
      - bootstrap-data:/bootstrap
    restart: "no"

  control:
    <<: [*control-image, *container-defaults]
    command: as-control run --bind 0.0.0.0:3350
    environment: *environment
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    ports:
      - "${CONTROL_PORT:-3350}:3350"
    volumes:
      - control-state:/control
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3350/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  relay:
    <<: [*relay-image, *container-defaults]
    command: >-
      as-relay run
      --relay-bind 0.0.0.0:3340
      --admin-bind 0.0.0.0:3341
      --qad-bind 0.0.0.0:${RELAY_QAD_BIND_PORT:-7842}
      --qad-port ${RELAY_QAD_PORT:-7842}
      --state-dir /relay
      --join-if-needed /bootstrap/relay.join
      --control-url http://control:3350
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    ports:
      - "${RELAY_PORT:-3340}:3340"
      - "${RELAY_QAD_PORT:-7842}:${RELAY_QAD_BIND_PORT:-7842}/udp"
      - "127.0.0.1:${RELAY_ADMIN_PORT:-3341}:3341"
    volumes:
      - relay-state:/relay
      - bootstrap-data:/bootstrap:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3341/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    restart: unless-stopped

volumes:
  control-state:
  relay-state:
  bootstrap-data:
