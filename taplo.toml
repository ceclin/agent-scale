exclude = [".upstreams/**", "submodules/**", "target/**"]
include = ["Cargo.toml", "**/*.toml"]

[formatting]
align_entries = false
allowed_blank_lines = 1
array_auto_collapse = true
array_auto_expand = true
array_trailing_comma = true
column_width = 100
compact_arrays = true
compact_inline_tables = false
crlf = false
indent_string = "  "
indent_tables = false
reorder_keys = true
trailing_newline = true
