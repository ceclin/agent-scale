name: Distribution

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to snapshot (defaults to the selected workflow ref)
        required: false
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: distribution-${{ github.ref }}-${{ inputs.ref }}

env:
  CARGO_TERM_COLOR: always
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/agent-scale

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.version.outputs.channel }}
      source_sha: ${{ steps.version.outputs.source_sha }}
      short_sha: ${{ steps.version.outputs.short_sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          short_sha="${source_sha:0:12}"
          workspace_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "agent-scale") | .version')"

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            base_version="${workspace_version%%-*}"
            version="${base_version}-snapshot.${GITHUB_RUN_NUMBER}.${short_sha}"
            channel=snapshot
          else
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
              echo "release tag must be a semantic version prefixed with v" >&2
              exit 1
            fi
            version="$workspace_version"
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "tag $GITHUB_REF_NAME does not match workspace version $version" >&2
              exit 1
            fi
            grep -Eq "^## ${version} - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md || {
              echo "CHANGELOG.md needs a dated $version release heading" >&2
              exit 1
            }
            if [[ "$version" == *-* ]]; then
              channel=prerelease
            else
              channel=release
            fi
          fi

          {
            echo "channel=$channel"
            echo "source_sha=$source_sha"
            echo "short_sha=$short_sha"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  verify:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
      - run: cargo x lint
      - run: cargo x test

  linux-binaries:
    needs: [validate, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: as-edge
            targets: x86_64-unknown-linux-musl aarch64-unknown-linux-musl x86_64-pc-windows-gnu
          - package: agent-scale
            targets: x86_64-unknown-linux-musl aarch64-unknown-linux-musl x86_64-pc-windows-gnu
          - package: as-control
            targets: x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          - package: as-relay
            targets: x86_64-unknown-linux-musl aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - run: cargo x init
      - name: Build static distribution binaries
        env:
          BIN_NAME: ${{ matrix.package }}
          PACKAGE: ${{ matrix.package }}
          PROFILE: dist
        run: ./scripts/zigbuild.sh ${{ matrix.targets }}
      - name: Package versioned archives
        run: >-
          ./scripts/package-release.sh
          target/zigbuild-dist
          ${{ matrix.package }}
          ${{ needs.validate.outputs.version }}
          target/release-artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.package }}-cross
          path: target/release-artifacts/*
          if-no-files-found: error
          retention-days: 1
      - name: Stage Control image binaries
        if: matrix.package == 'as-control' || matrix.package == 'as-relay'
        shell: bash
        run: |
          set -euo pipefail
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            case "$target" in
              x86_64-unknown-linux-musl) arch=amd64 ;;
              aarch64-unknown-linux-musl) arch=arm64 ;;
              *) echo "unsupported container target: $target" >&2; exit 1 ;;
            esac
            mkdir -p target/container-root/bin
            cp "target/zigbuild-dist/$target/${{ matrix.package }}" \
              "target/container-root/bin/${{ matrix.package }}-$arch"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.package == 'as-control' || matrix.package == 'as-relay'
        with:
          name: container-${{ matrix.package }}
          path: target/container-root
          if-no-files-found: error
          retention-days: 1

  macos-center:
    needs: [validate, verify]
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-${{ matrix.target }}
      - run: cargo build --locked --profile dist -p agent-scale --target ${{ matrix.target }}
      - name: Stage and package binary
        shell: bash
        run: |
          set -euo pipefail
          input="target/macos-dist/${{ matrix.target }}"
          mkdir -p "$input"
          cp "target/${{ matrix.target }}/dist/agent-scale" "$input/"
          cp LICENSE "$input/"
          cp licenses/dependencies/agent-scale.html "$input/THIRD_PARTY_LICENSES.html"
          ./scripts/package-release.sh \
            target/macos-dist \
            agent-scale \
            "${{ needs.validate.outputs.version }}" \
            target/release-artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-agent-scale-${{ matrix.target }}
          path: target/release-artifacts/*
          if-no-files-found: error
          retention-days: 1

  container:
    needs: [validate, linux-binaries]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [control, relay]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: container-*
          path: target/container-root
          merge-multiple: true
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          tags: |
            type=raw,value=${{ needs.validate.outputs.version }}
            type=raw,value=snapshot-${{ needs.validate.outputs.short_sha }},enable=${{ needs.validate.outputs.channel == 'snapshot' }}
            type=raw,value=snapshot,enable=${{ needs.validate.outputs.channel == 'snapshot' }}
            type=raw,value=preview,enable=${{ needs.validate.outputs.channel == 'prerelease' }}
            type=raw,value=latest,enable=${{ needs.validate.outputs.channel == 'release' }}
          labels: |
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.validate.outputs.source_sha }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: ${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  snapshot:
    needs: [validate, linux-binaries, macos-center, container]
    if: needs.validate.outputs.channel == 'snapshot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: snapshot-artifacts
          merge-multiple: true
      - name: Verify and consolidate SHA-256 checksums
        shell: bash
        working-directory: snapshot-artifacts
        run: |
          set -euo pipefail
          find . -maxdepth 1 -name '*.sha256' -print0 \
            | sort -z \
            | xargs -0 cat > SHA256SUMS
          test -s SHA256SUMS
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-scale-${{ needs.validate.outputs.version }}
          path: |
            snapshot-artifacts/*.tar.gz
            snapshot-artifacts/*.zip
            snapshot-artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [validate, linux-binaries, macos-center, container]
    if: needs.validate.outputs.channel != 'snapshot'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true
      - name: Verify and consolidate SHA-256 checksums
        shell: bash
        working-directory: release-artifacts
        run: |
          set -euo pipefail
          find . -maxdepth 1 -name '*.sha256' -print0 \
            | sort -z \
            | xargs -0 cat > SHA256SUMS
          test -s SHA256SUMS
          sha256sum --check SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          prerelease: ${{ needs.validate.outputs.channel == 'prerelease' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-artifacts/*.tar.gz
            release-artifacts/*.zip
            release-artifacts/SHA256SUMS
