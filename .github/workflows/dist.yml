name: Distribution

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to snapshot (defaults to the selected workflow ref)
        required: false
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: distribution-${{ github.ref }}-${{ inputs.ref }}

env:
  CARGO_TERM_COLOR: always
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/agent-scale

jobs:
  metadata:
    name: Distribution metadata
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.version.outputs.channel }}
      source_sha: ${{ steps.version.outputs.source_sha }}
      short_sha: ${{ steps.version.outputs.short_sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          short_sha="${source_sha:0:12}"
          workspace_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "agent-scale") | .version')"

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            base_version="${workspace_version%%-*}"
            version="${base_version}-snapshot.${GITHUB_RUN_NUMBER}.${short_sha}"
            channel=snapshot
          else
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
              echo "release tag must be a semantic version prefixed with v" >&2
              exit 1
            fi
            version="${GITHUB_REF_NAME#v}"
            if [[ "$version" == *-* ]]; then
              base_version="${version%%-*}"
              if [ "$workspace_version" != "$base_version" ]; then
                echo "prerelease tag $GITHUB_REF_NAME does not target workspace version $workspace_version" >&2
                exit 1
              fi
              channel=prerelease
            else
              if [ "$workspace_version" != "$version" ]; then
                echo "release tag $GITHUB_REF_NAME does not match workspace version $workspace_version" >&2
                exit 1
              fi
              grep -Eq "^## ${version} - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md || {
                echo "CHANGELOG.md needs a dated $version release heading" >&2
                exit 1
              }
              channel=release
            fi
          fi

          {
            echo "channel=$channel"
            echo "source_sha=$source_sha"
            echo "short_sha=$short_sha"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  verify:
    name: Source verification
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.source_sha }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: verify-iroh-${{ hashFiles('vendor/iroh/**') }}-iroh-blobs-${{ hashFiles('vendor/iroh-blobs/**') }}
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          cache-dependency-glob: scripts/sync-deps.py
      - run: cargo x lint
      - run: cargo x test

  linux-binaries:
    name: Build ${{ matrix.package }} (${{ matrix.platform.target }})
    needs: [metadata, verify]
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        package: [agent-scale, as-edge, as-control, as-relay]
        platform:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            arch: amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.source_sha }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.platform.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Cargo's dependency cache can retain a vendored path dependency even
          # when its source changes; include both vendored source fingerprints in the key.
          key: release-${{ matrix.package }}-${{ matrix.platform.target }}-iroh-${{ hashFiles('vendor/iroh/**') }}-iroh-blobs-${{ hashFiles('vendor/iroh-blobs/**') }}
      - name: Install musl C toolchain
        run: sudo apt-get update && sudo apt-get install --no-install-recommends musl-tools
      - run: cargo x init
      - name: Build static distribution binary
        shell: bash
        run: |
          target="${{ matrix.platform.target }}"
          export "CC_${target//-/_}=musl-gcc"
          if [ "$target" = "aarch64-unknown-linux-musl" ]; then
            # GCC's AArch64 outline-atomics initializer references glibc's
            # __getauxval, which musl does not provide.
            export CFLAGS_aarch64_unknown_linux_musl=-mno-outline-atomics
          fi
          cargo build --locked --profile dist \
            -p "${{ matrix.package }}" \
            --target "$target"
      - name: Stage distribution files
        shell: bash
        run: |
          set -euo pipefail
          package="${{ matrix.package }}"
          target="${{ matrix.platform.target }}"
          input="target/linux-dist/$package/$target"
          mkdir -p "$input"
          cp "target/$target/dist/$package" "$input/"
          cp LICENSE "$input/"
          cp "licenses/dependencies/$package.html" "$input/THIRD_PARTY_LICENSES.html"
          if [ "$package" = "as-edge" ]; then
            cp THIRD_PARTY.md "$input/"
            mkdir -p "$input/licenses/fd" "$input/licenses/ripgrep"
            cp .upstreams/fd/LICENSE-APACHE .upstreams/fd/LICENSE-MIT "$input/licenses/fd/"
            cp .upstreams/ripgrep/LICENSE-MIT .upstreams/ripgrep/UNLICENSE "$input/licenses/ripgrep/"
            cp licenses/ripgrep/LICENSE-BSD-3-Clause-zsh-users "$input/licenses/ripgrep/"
          fi
      - name: Package versioned archives
        run: >-
          ./scripts/package-release.sh
          target/linux-dist/${{ matrix.package }}
          ${{ matrix.package }}
          ${{ needs.metadata.outputs.version }}
          target/release-artifacts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.package }}-${{ matrix.platform.target }}
          path: target/release-artifacts/*
          if-no-files-found: error
          retention-days: 1
      - name: Stage container image binaries
        if: matrix.package == 'as-control' || matrix.package == 'as-relay'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/container-root/bin
          cp "target/${{ matrix.platform.target }}/dist/${{ matrix.package }}" \
            "target/container-root/bin/${{ matrix.package }}-${{ matrix.platform.arch }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.package == 'as-control' || matrix.package == 'as-relay'
        with:
          name: container-${{ matrix.package }}-${{ matrix.platform.arch }}
          path: target/container-root
          if-no-files-found: error
          retention-days: 1

  windows-binaries:
    name: Build ${{ matrix.package }} (x86_64-pc-windows-msvc)
    needs: [metadata, verify]
    runs-on: windows-2025
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        package: [agent-scale, as-edge]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.source_sha }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Keep cached target artifacts tied to both vendored iroh sources.
          key: release-${{ matrix.package }}-x86_64-pc-windows-msvc-iroh-${{ hashFiles('vendor/iroh/**') }}-iroh-blobs-${{ hashFiles('vendor/iroh-blobs/**') }}
      - run: cargo x init
      - run: >-
          cargo build --locked --profile dist
          -p ${{ matrix.package }}
          --target x86_64-pc-windows-msvc
      - name: Package versioned archive
        shell: pwsh
        env:
          PACKAGE: ${{ matrix.package }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $target = "x86_64-pc-windows-msvc"
          $bundle = "$($env:PACKAGE)-v$($env:VERSION)-$target"
          $temporaryRoot = Join-Path $env:RUNNER_TEMP "agent-scale-release"
          $staging = Join-Path $temporaryRoot $bundle
          $outputRoot = Join-Path $PWD "target/release-artifacts"
          New-Item -ItemType Directory -Force $staging, $outputRoot | Out-Null
          Copy-Item "target/$target/dist/$($env:PACKAGE).exe", "LICENSE", "licenses/dependencies/$($env:PACKAGE).html" $staging
          Move-Item "$staging/$($env:PACKAGE).html" "$staging/THIRD_PARTY_LICENSES.html"
          if ($env:PACKAGE -eq "as-edge") {
            Copy-Item "THIRD_PARTY.md" $staging
            New-Item -ItemType Directory -Force "$staging/licenses/fd", "$staging/licenses/ripgrep" | Out-Null
            Copy-Item ".upstreams/fd/LICENSE-APACHE", ".upstreams/fd/LICENSE-MIT" "$staging/licenses/fd"
            Copy-Item ".upstreams/ripgrep/LICENSE-MIT", ".upstreams/ripgrep/UNLICENSE", "licenses/ripgrep/LICENSE-BSD-3-Clause-zsh-users" "$staging/licenses/ripgrep"
          }
          $archive = Join-Path $outputRoot "$bundle.zip"
          Push-Location $temporaryRoot
          Compress-Archive -Path $bundle -DestinationPath $archive
          Pop-Location
          $checksum = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText(
            "${archive}.sha256",
            "$checksum  $bundle.zip`n",
            [Text.Encoding]::ASCII
          )
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.package }}-x86_64-pc-windows-msvc
          path: target/release-artifacts/*
          if-no-files-found: error
          retention-days: 1

  android-edge:
    name: Build as-edge (${{ matrix.target }})
    needs: [metadata, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: armv7-linux-androideabi
            linker: armv7a-linux-androideabi21-clang
          - target: aarch64-linux-android
            linker: aarch64-linux-android21-clang
          - target: x86_64-linux-android
            linker: x86_64-linux-android21-clang
    env:
      ANDROID_NDK_VERSION: 27.3.13750724
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.source_sha }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-as-edge-${{ matrix.target }}-iroh-${{ hashFiles('vendor/iroh/**') }}-iroh-blobs-${{ hashFiles('vendor/iroh-blobs/**') }}
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK and NDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          cmdline-tools-version: "14742923"
          packages: ndk;${{ env.ANDROID_NDK_VERSION }}
          log-accepted-android-sdk-licenses: false
      - run: cargo x init
      - name: Build Android distribution binary
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"
          toolchain="$android_sdk/ndk/$ANDROID_NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"
          linker="$toolchain/${{ matrix.linker }}"
          target_env="${target//-/_}"
          export "CARGO_TARGET_${target_env^^}_LINKER=$linker"
          export "CC_${target_env}=$linker"
          export "AR_${target_env}=$toolchain/llvm-ar"
          cargo build --locked --profile dist -p as-edge --target "$target"
      - name: Stage and package binary
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          input="target/android-dist/as-edge/$target"
          mkdir -p "$input/licenses/fd" "$input/licenses/ripgrep"
          cp "target/$target/dist/as-edge" "$input/"
          cp LICENSE THIRD_PARTY.md "$input/"
          cp licenses/dependencies/as-edge.html "$input/THIRD_PARTY_LICENSES.html"
          cp .upstreams/fd/LICENSE-APACHE .upstreams/fd/LICENSE-MIT "$input/licenses/fd/"
          cp .upstreams/ripgrep/LICENSE-MIT .upstreams/ripgrep/UNLICENSE "$input/licenses/ripgrep/"
          cp licenses/ripgrep/LICENSE-BSD-3-Clause-zsh-users "$input/licenses/ripgrep/"
          ./scripts/package-release.sh \
            target/android-dist/as-edge \
            as-edge \
            "${{ needs.metadata.outputs.version }}" \
            target/release-artifacts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-as-edge-${{ matrix.target }}
          path: target/release-artifacts/*
          if-no-files-found: error
          retention-days: 1

  macos-binaries:
    name: Build ${{ matrix.package }} (${{ matrix.target }})
    needs: [metadata, verify]
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        package: [agent-scale, as-edge]
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.source_sha }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-${{ matrix.package }}-${{ matrix.target }}-iroh-${{ hashFiles('vendor/iroh/**') }}-iroh-blobs-${{ hashFiles('vendor/iroh-blobs/**') }}
      - if: matrix.package == 'as-edge'
        run: cargo x init
      - run: cargo build --locked --profile dist -p ${{ matrix.package }} --target ${{ matrix.target }}
      - name: Stage and package binary
        shell: bash
        run: |
          set -euo pipefail
          package="${{ matrix.package }}"
          input="target/macos-dist/$package/${{ matrix.target }}"
          mkdir -p "$input"
          cp "target/${{ matrix.target }}/dist/$package" "$input/"
          cp LICENSE "$input/"
          cp "licenses/dependencies/$package.html" "$input/THIRD_PARTY_LICENSES.html"
          if [ "$package" = "as-edge" ]; then
            cp THIRD_PARTY.md "$input/"
            mkdir -p "$input/licenses/fd" "$input/licenses/ripgrep"
            cp .upstreams/fd/LICENSE-APACHE .upstreams/fd/LICENSE-MIT "$input/licenses/fd/"
            cp .upstreams/ripgrep/LICENSE-MIT .upstreams/ripgrep/UNLICENSE "$input/licenses/ripgrep/"
            cp licenses/ripgrep/LICENSE-BSD-3-Clause-zsh-users "$input/licenses/ripgrep/"
          fi
          ./scripts/package-release.sh \
            "target/macos-dist/$package" \
            "$package" \
            "${{ needs.metadata.outputs.version }}" \
            target/release-artifacts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.package }}-${{ matrix.target }}
          path: target/release-artifacts/*
          if-no-files-found: error
          retention-days: 1

  container-images:
    name: Publish ${{ matrix.image }} container
    needs: [metadata, linux-binaries]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [control, relay]
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.source_sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: container-*
          path: target/container-root
          merge-multiple: true
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          tags: |
            type=raw,value=${{ needs.metadata.outputs.version }}
            type=raw,value=snapshot-${{ needs.metadata.outputs.short_sha }},enable=${{ needs.metadata.outputs.channel == 'snapshot' }}
            type=raw,value=snapshot,enable=${{ needs.metadata.outputs.channel == 'snapshot' }}
            type=raw,value=preview,enable=${{ needs.metadata.outputs.channel == 'prerelease' }}
            type=raw,value=latest,enable=${{ needs.metadata.outputs.channel == 'release' }}
          labels: |
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.metadata.outputs.source_sha }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: ${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Attest container image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  snapshot-bundle:
    name: Assemble snapshot bundle
    needs: [metadata, linux-binaries, windows-binaries, android-edge, macos-binaries, container-images]
    if: needs.metadata.outputs.channel == 'snapshot'
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: snapshot-artifacts
          merge-multiple: true
      - name: Verify and consolidate SHA-256 checksums
        shell: bash
        working-directory: snapshot-artifacts
        run: |
          set -euo pipefail
          find . -maxdepth 1 -name '*.sha256' -print0 \
            | sort -z \
            | xargs -0 cat > SHA256SUMS
          test -s SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Attest checksum manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: snapshot-artifacts/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-scale-${{ needs.metadata.outputs.version }}
          path: |
            snapshot-artifacts/*.tar.gz
            snapshot-artifacts/*.zip
            snapshot-artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  github-release:
    name: Publish GitHub release
    needs: [metadata, linux-binaries, windows-binaries, android-edge, macos-binaries, container-images]
    if: needs.metadata.outputs.channel != 'snapshot'
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true
      - name: Verify and consolidate SHA-256 checksums
        shell: bash
        working-directory: release-artifacts
        run: |
          set -euo pipefail
          find . -maxdepth 1 -name '*.sha256' -print0 \
            | sort -z \
            | xargs -0 cat > SHA256SUMS
          test -s SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Attest checksum manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-artifacts/SHA256SUMS
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          prerelease: ${{ needs.metadata.outputs.channel == 'prerelease' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-artifacts/*.tar.gz
            release-artifacts/*.zip
            release-artifacts/SHA256SUMS

  prune-build-caches:
    name: Prune stale distribution caches
    needs: [metadata, snapshot-bundle, github-release]
    if: >-
      always() &&
      needs.metadata.result == 'success' &&
      (needs.snapshot-bundle.result == 'success' || needs.github-release.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Keep the latest distribution cache generation
        shell: bash
        run: |
          set -euo pipefail
          default_ref="refs/heads/${{ github.event.repository.default_branch }}"

          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" \
            | jq -s -r --arg default_ref "$default_ref" '
                def family:
                  .key | sub("-[0-9a-f]{8}-[0-9a-f]{8}$"; "");
                [.[].actions_caches[]
                 | select(.key | startswith("v0-rust-release-"))]
                | sort_by([.ref, family, .created_at])
                | group_by([.ref, family])
                | map(
                    if .[0].ref == $default_ref
                    then .[0:-1]
                    else .
                    end
                  )
                | flatten
                | .[]
                | [.id, .ref, .key]
                | @tsv
              ' \
            | while IFS=$'\t' read -r id ref key; do
                echo "Deleting stale cache $key ($ref)"
                gh api --method DELETE \
                  "repos/${GITHUB_REPOSITORY}/actions/caches/$id"
              done
