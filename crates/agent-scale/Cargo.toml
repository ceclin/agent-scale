[package]
edition.workspace = true
license.workspace = true
name = "agent-scale"
publish = false
repository.workspace = true
version.workspace = true

[[bin]]
name = "agent-scale"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true }
control-api = { path = "../control-api" }
fs2 = "0.4"
fast-socks5 = "1.0"
hex = { workspace = true }
iroh = "1.0.3"
iroh-blobs = "0.103"
protocol = { package = "scale-protocol", path = "../protocol" }
rand = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rmcp = { version = "3.1", default-features = false, features = [
  "client",
  "transport-child-process",
] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
scale-core = { workspace = true }
scale-transport = { path = "../transport" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = "3"
tokio = { workspace = true }
toml_edit = "0.25"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
