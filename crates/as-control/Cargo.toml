[package]
edition.workspace = true
license.workspace = true
name = "as-control"
publish = false
repository.workspace = true
version.workspace = true

[[bin]]
name = "as-control"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
axum = "0.8"
base64 = { workspace = true }
clap = { workspace = true }
control-api = { path = "../control-api" }
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["http1", "http2", "server-auto", "service", "tokio"] }
iroh-base = { version = "1.0.3", features = ["key"] }
rand = { workspace = true }
rcgen = { version = "0.14", features = ["x509-parser"] }
relay-api = { path = "../relay-api" }
rusqlite = { version = "0.38", features = ["bundled"] }
scale-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = "0.3"
tokio = { workspace = true }
tower = "0.5"
tower-http = { version = "0.6", features = ["timeout"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
